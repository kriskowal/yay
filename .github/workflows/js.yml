name: JavaScript

on:
  push:
    branches: [main]
    paths:
      - 'js/**'
      - 'rust/**'
      - 'test/**'
      - 'doc/design/tagged-values-g/cases/**'
      - '.github/workflows/js.yml'
  pull_request:
    branches: [main]
    paths:
      - 'js/**'
      - 'rust/**'
      - 'test/**'
      - 'doc/design/tagged-values-g/cases/**'
      - '.github/workflows/js.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: js/libyay

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build binyay
        working-directory: rust
        run: cargo build --release -p binyay

      - name: Install the dev dependencies
        run: npm ci

      - name: Run tests
        env:
          YAY_BIN: ${{ github.workspace }}/rust/target/release/yay
          YAY_REQUIRE_SMALLCAPS: '1'
        run: node --test yay.test.js tagged.test.js smallcaps.test.js references.test.js capdata.test.js
